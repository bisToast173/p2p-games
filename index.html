<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P2P</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #607791;
        }

        #container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            height: 90%;
            gap: 20px;
        }

        #main {
            width: 60%;
            height: 90%;
            background-color: #2b2b2b;
            position: relative;
            overflow: hidden;
            border: 3px solid white;
            border-radius: 10px;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-family: Montserrat, sans-serif;
            font-weight: bold;
            z-index: 10;
            user-select: none;
        }

        .brick, #paddle, #ball {
            position: absolute;
        }

        #paddle{
            background-color: #E8B895E6;
            border-radius: 6px;
        }

        #ball {
            background-color: #ffffff;
            border-radius: 50%;
        }

        .brick {
            border-radius: 4px;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.3);
        }

        .sidebar {
            width: 160px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 15px;
        }

        #title {
            font-style: oblique;
            font-size: 50px;
            font-family: Montserrat sans-serif;
            text-align: center;
        }

        .text-title {
            text-align: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .panel {
            background-color: #313379;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid white;
        }
        #effects-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .effect-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: white;
            font-weight: bold;
            padding: 6px;
            border-radius: 4px;
            background-color: rgba(0, 0, 0, 0.3);
        }
        #right-sidebar {
            margin-top: 30%;
        }

        button {
            cursor: pointer;
            background-color: #ffffff;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        button:hover {
            background-color: #b64d4d;
        }

        #level-panel {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        #level-panel .level {
            width: 100%;
            padding: 8px 0;
            margin: auto;
            font-size: 14px;
        }

        #btn-pause{
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        #btn-restart{
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        @keyframes flashing {
            0% { background-color: #222; }
            50% { background-color: #fff; }
            100% { background-color: #222; }
        }
        .flash-active {
            animation: flashing 0.2s infinite;
        }

        .laser {
            position: absolute;
            width: 4px;
            height: 15px;
            background-color: cyan;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="container">

        <div class="sidebar" id="left-sidebar">
            <h2 id="title">Ping 2 Pong</h2>

            <div class="panel">
                <p class="text-title">Hiệu ứng</p>
                <div id="effects-container">
                    <span style="color: #aaa; font-size: 14px;">Không có</span>
                </div>
            </div>

            <div class="panel">
                <p class="text-title">Đạn laser</p>
                <span class="text-title" id="ammo">0</span>
            </div>

        </div>


        <div id="main">
            <div id="overlay">Click chuột phải để bắt đầu</div>
            <div id="bricks"></div>
            <div id="paddle"></div>
            <div id="ball"></div>
        </div>

        <div class="sidebar" id="right-sidebar">
            <div class="panel">
                <p class="text-title">Màn chơi</p>
                <div id="level-panel">
                    <button class="level">1</button>
                    <button class="level">2</button>
                    <button class="level">3</button>
                    <button class="level">4</button>
                    <button class="level">5</button>
                    <button class="level">6</button>
                    <button class="level">7</button>
                </div>
            </div>

            <div class="panel">
                <button id="btn-pause">Tạm dừng</button>
                <button id="btn-restart">Chơi lại</button>
            </div>
        </div>

    </div>



    <script src="script.js"></script>
</body>
</html>
