<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>P2P</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="container">

        <div class="sidebar" id="left-sidebar">
            <h2 id="title">Ping 2 Pong</h2>

            <div class="panel">
                <p class="text-title">Hiệu ứng</p>
                <div id="effects-container">
                    <span style="color: #aaa; font-size: 14px;">Không có</span>
                </div>
            </div>

            <div class="panel">
                <p class="text-title">Đạn laser</p>
                <span class="text-title" id="ammo">0</span>
            </div>

        </div>


        <div id="main">
            <div id="overlay">Click chuột phải để bắt đầu</div>
            <div id="bricks"></div>
            <div id="paddle"></div>
            <div id="ball"></div>
        </div>

        <div class="sidebar" id="right-sidebar">
            <div class="panel">
                <p class="text-title">Màn chơi</p>
                <div id="level-panel">
                    <button class="level">1</button>
                    <button class="level">2</button>
                    <button class="level">3</button>
                    <button class="level">4</button>
                    <button class="level">5</button>
                    <button class="level">6</button>
                    <button class="level">7</button>
                </div>
            </div>

            <div class="panel">
                <button id="btn-pause">Tạm dừng</button>
                <button id="btn-restart">Chơi lại</button>
            </div>
        </div>

    </div>



    <script src="script.js"></script>
</body>
</html>
